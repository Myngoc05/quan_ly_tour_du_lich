<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TravelGo — Khám phá thế giới cùng bạn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
:root{
  --blue:#2F5CE0;--blue-dark:#1E3FAE;--blue-light:#EAF0FE;--navy:#12163A;
  --bg:#F4F6FB;--ink:#1B2233;--muted:#6B7280;--border:#E4E8F0;
  --success:#1FAE6B;--success-bg:#E7F8EF;--warning:#F5A623;--warning-bg:#FEF3E1;
  --danger:#E5484D;--danger-bg:#FDEAEA;--panel:#fff;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,sans-serif}
h1,h2,h3,.logo{font-family:Poppins,sans-serif}
button,input,select,textarea{font-family:inherit}
a{color:inherit;text-decoration:none;cursor:pointer}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
header.top{display:flex;align-items:center;justify-content:space-between;padding:14px 32px;background:#fff;border-bottom:1px solid var(--border);flex-wrap:wrap;gap:12px;position:sticky;top:0;z-index:30}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:19px;color:var(--blue)}
.logo span{display:block;font-family:Inter;font-weight:500;font-size:10px;color:var(--muted)}
.plane{width:26px;height:26px;background:var(--blue);border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;flex:none}
.cust-nav{display:flex;gap:24px;font-size:14px;font-weight:500;color:#3a4152}
.cust-nav a.active{color:var(--blue)}
.actions{display:flex;gap:10px;align-items:center;position:relative}
.btn{border:none;border-radius:8px;padding:10px 18px;font-weight:600;font-size:14px;cursor:pointer}
.btn.primary{background:var(--blue);color:#fff}
.btn.outline{background:#fff;border:1px solid var(--border);color:var(--ink)}
.btn.sm{padding:6px 12px;font-size:12.5px;border-radius:6px}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--blue-light);color:var(--blue-dark);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;cursor:pointer}
.dropdown{position:absolute;top:44px;right:0;background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:0 8px 24px rgba(20,30,60,.12);min-width:190px;overflow:hidden;z-index:40}
.dropdown a{display:block;padding:10px 16px;font-size:13.5px}
.dropdown a:hover{background:var(--bg)}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:700}
.badge.wait{background:var(--warning-bg);color:#B5760B}
.badge.confirmed{background:var(--blue-light);color:var(--blue-dark)}
.badge.paid,.badge.active{background:var(--success-bg);color:var(--success)}
.tour-card{background:#fff;border:1px solid var(--border);border-radius:12px;overflow:hidden;cursor:pointer}
.tour-thumb{height:120px;position:relative;color:#fff}
.tour-card .body{padding:14px}
.tour-card h4{margin:0 0 6px;font-size:15px}
.tour-card .meta{font-size:12px;color:var(--muted);margin-bottom:8px}
.tour-card .price{color:var(--blue);font-weight:700;font-size:16px}
.tour-card .old{color:#9aa2b1;text-decoration:line-through;font-weight:500;font-size:12.5px;margin-left:6px}
.pill{position:absolute;top:8px;left:8px;background:rgba(255,255,255,.92);color:var(--ink);border-radius:5px;padding:2px 7px;font-size:10px;font-weight:700}
.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:22px}
.grid{display:grid;gap:18px}
.g4{grid-template-columns:repeat(4,1fr)} .g3{grid-template-columns:repeat(3,1fr)} .g2{grid-template-columns:repeat(2,1fr)}
@media(max-width:900px){.g4,.g3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:640px){.g4,.g3,.g2{grid-template-columns:1fr}}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:10px 9px;text-align:left;border-bottom:1px solid var(--border)}
th{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.4px;font-weight:700}
.icon-btn{width:28px;height:28px;border-radius:6px;border:1px solid var(--border);background:#fff;display:inline-flex;align-items:center;justify-content:center;margin-right:4px;cursor:pointer;font-size:12px}
.icon-btn.del{color:var(--danger);border-color:#F6CFCF}
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;font-weight:600;margin-bottom:5px;color:#3a4152}
.field input,.field select,.field textarea{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:#fff;font-size:14px}
.search-bar{display:flex;background:#fff;border:1px solid var(--border);border-radius:12px;overflow:hidden;flex-wrap:wrap}
.search-bar .seg{flex:1;min-width:140px;padding:10px 16px;border-right:1px solid var(--border)}
.search-bar .seg small{display:block;color:var(--muted);font-size:11px;margin-bottom:2px}
.search-bar .seg input,.search-bar .seg select{border:none;padding:0;font-size:13.5px;width:100%}
.search-bar button{background:var(--blue);color:#fff;border:none;padding:0 26px;font-weight:700;cursor:pointer;min-width:120px}
.hero{position:relative;padding:60px 32px 36px;color:#fff;background:linear-gradient(120deg,#123B7A,#1E5FCB 55%,#3F9BD6)}
.hero h1{font-size:32px;margin:0 0 10px;max-width:16ch}
.hero p{max-width:48ch;opacity:.9;margin:0 0 22px}
.msg{padding:11px 15px;border-left:4px solid var(--success);background:var(--success-bg);font-size:13.5px;border-radius:0 8px 8px 0;margin:12px 0}
.msg.err{border-color:var(--danger);background:var(--danger-bg);color:#7a2b1e}
.rule-note{background:var(--blue-light);border-left:3px solid var(--blue);padding:9px 13px;font-size:12.5px;color:#233;border-radius:0 8px 8px 0;margin:14px 0}
.auth-wrap{min-height:600px;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#0E2A5C,#1F6FC9 60%,#57B8D6);padding:40px 16px}
.auth-card{background:#fff;border-radius:16px;padding:32px 30px;width:100%;max-width:400px}
.auth-card .logo{justify-content:center;margin-bottom:8px}
.auth-card h2{text-align:center;margin:0 0 4px}
.auth-card .sub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:20px}
.foot-link{text-align:center;font-size:13px;margin-top:14px;color:var(--muted)}
.foot-link a{color:var(--blue);font-weight:600}
.check-row{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;color:var(--muted);margin-bottom:14px}
.side-shell{display:flex;gap:0;min-height:560px;background:#fff;border-radius:12px;overflow:hidden;border:1px solid var(--border)}
.side{width:210px;flex:none;border-right:1px solid var(--border);padding:20px 10px}
.side a{display:block;padding:10px 14px;border-radius:8px;font-size:13.5px;font-weight:500;color:#3a4152;margin-bottom:2px}
.side a.active{background:var(--blue-light);color:var(--blue-dark)}
.side-content{flex:1;padding:24px 26px;min-width:0}
.order-row{display:flex;gap:14px;border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px;align-items:center;flex-wrap:wrap}
.order-thumb{width:60px;height:60px;border-radius:9px;flex:none;color:#fff}
.order-row .info{flex:1;min-width:160px}
.order-row .info h4{margin:0 0 4px;font-size:14.5px}
.order-row .info .meta{font-size:12px;color:var(--muted)}
.qr{width:140px;height:140px;background:repeating-conic-gradient(var(--ink) 0% 25%, #fff 0% 50%) 0/14px 14px;border:7px solid #fff;outline:2px solid var(--ink);margin:12px 0}
.admin-shell{display:flex;min-height:640px}
.sidebar{width:224px;background:var(--navy);color:#cfd4ea;padding:18px 12px;flex:none}
.sidebar .logo{color:#fff;padding:6px 10px 20px}
.sidebar a{display:block;padding:10px 12px;border-radius:8px;font-size:13.5px;margin-bottom:2px;font-weight:500}
.sidebar a.active{background:var(--blue);color:#fff}
.admin-main{flex:1;padding:22px 26px;min-width:0}
.admin-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px}
.stat-card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:16px}
.stat-card .lbl{font-size:12.5px;color:var(--muted);margin-bottom:6px}
.stat-card .val{font-size:22px;font-weight:700;font-family:Poppins}
footer.site{padding:26px 32px;color:var(--muted);font-size:12.5px;text-align:center;border-top:1px solid var(--border);background:#fff}
.loading{padding:60px;text-align:center;color:var(--muted)}
.icon-circle{width:36px;height:36px;border-radius:50%;border:1px solid var(--border);background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;font-size:15px}
.icon-circle .dot{position:absolute;top:6px;right:7px;width:7px;height:7px;border-radius:50%;background:var(--danger)}
.notif-list a{display:block;padding:10px 14px;font-size:12.5px;white-space:normal;border-bottom:1px solid var(--border)}
.notif-list a:last-child{border-bottom:none}
.stars{color:#F5A623;font-size:13px;letter-spacing:1px}
.usp{display:flex;gap:10px;align-items:flex-start;font-size:13px}
.usp b{display:block;font-size:13.5px}
.usp span{color:var(--muted);font-size:12px}
.tabs-row{display:flex;gap:4px;border-bottom:1px solid var(--border);margin:18px 0}
.tabs-row button{background:none;border:none;padding:10px 16px;font-weight:600;font-size:13.5px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent}
.tabs-row button.active{color:var(--blue);border-color:var(--blue)}
.filters-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.filters-row select,.filters-row input{padding:9px 12px;border:1px solid var(--border);border-radius:8px;background:#fff;font-size:13px}
.pager{display:flex;gap:6px;justify-content:flex-end;margin-top:12px}
.pager button{width:30px;height:30px;border:1px solid var(--border);background:#fff;border-radius:6px;cursor:pointer;font-size:13px}
.pager button.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.badge.locked,.badge.inactive,.badge.cancelled{background:var(--danger-bg);color:var(--danger)}
.badge.full{background:var(--danger-bg);color:var(--danger)}
.badge.low{background:var(--warning-bg);color:#B5760B}
.range-btns{display:flex;gap:8px}
.range-btns button{background:#fff;border:1px solid var(--border);padding:8px 14px;border-radius:8px;font-size:12.5px;font-weight:600;cursor:pointer}
.range-btns button.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.chart-box{background:#fff;border:1px solid var(--border);border-radius:12px;padding:18px}
.star-input span{font-size:22px;cursor:pointer;color:#D8DEEA}
.star-input span.sel{color:#F5A623}
.review-item{border-bottom:1px solid var(--border);padding:12px 0}
.review-item:last-child{border-bottom:none}
</style>
</head>
<body>
<div id="app"><div class="loading">Đang tải...</div></div>

<script>
/* ================= API HELPER ================= */
const API='/api';
function getToken(){return localStorage.getItem('tg_token');}
function getUser(){try{return JSON.parse(localStorage.getItem('tg_user'));}catch(e){return null;}}
function setSession(token,user){localStorage.setItem('tg_token',token);localStorage.setItem('tg_user',JSON.stringify(user));}
function clearSession(){localStorage.removeItem('tg_token');localStorage.removeItem('tg_user');}
async function api(path,opts){
  opts=opts||{};
  const headers=Object.assign({'Content-Type':'application/json'},opts.headers||{});
  const token=getToken(); if(token) headers['Authorization']='Bearer '+token;
  const res=await fetch(API+path,Object.assign({},opts,{headers}));
  let data={}; try{data=await res.json();}catch(e){}
  if(!res.ok) throw new Error(data.error||'Có lỗi xảy ra, vui lòng thử lại.');
  return data;
}
function fmt(n){return Number(n||0).toLocaleString('vi-VN')+'đ';}
function grad(i){return ['linear-gradient(135deg,#1D5FA8,#4FB3D9)','linear-gradient(135deg,#2E6B4F,#7FBF6A)','linear-gradient(135deg,#B5622A,#E8A23C)','linear-gradient(135deg,#5B3E9E,#9C6FD6)','linear-gradient(135deg,#0E7C7B,#4FD1C5)'][i%5];}
const statusLabel={wait:'Chờ xác nhận',confirmed:'Đã xác nhận',paid:'Đã thanh toán',done:'Hoàn thành',cancelled:'Đã hủy'};

let route={view:'home',params:{}};
function nav(view,params){route={view,params:params||{}};render();window.scrollTo({top:0,behavior:'smooth'});}
function toggleMenu(){const m=document.getElementById('userMenu');if(m)m.style.display=m.style.display==='none'?'block':'none';}
function logout(){clearSession();nav('home');}

/* ================= HEADER / FOOTER ================= */
function siteHeader(active){
 const links=[['home','Trang chủ'],['list-trongnuoc','Tour trong nước'],['list-nuocngoai','Tour nước ngoài'],['blog','Blog'],['contact','Liên hệ']];
 const user=getUser();
 let authArea;
 if(!user){
   authArea=`<button class="btn outline sm" onclick="nav('login')">Đăng nhập</button><button class="btn primary sm" onclick="nav('register')">Đăng ký</button>`;
 }else{
   const label = user.role==='employee' ? 'AD' : (user.name||'KH').split(' ').slice(-1)[0][0]+'K';
   authArea=`
   <div class="icon-circle" onclick="toggleSearchBox()">🔍</div>
   <div style="position:relative">
    <div class="icon-circle" onclick="toggleNotif()">🔔<span class="dot"></span></div>
    <div class="dropdown notif-list" id="notifBox" style="display:none;width:260px">
     <a>📦 Đơn đặt tour của bạn đang được xử lý.</a>
     <a>🎉 Ưu đãi mới: giảm 10% tour Phú Quốc tháng này.</a>
     <a>✅ Cảm ơn bạn đã đồng hành cùng TravelGo!</a>
    </div>
   </div>
   <div class="avatar" onclick="toggleMenu()">${label}</div>
   <div class="dropdown" id="userMenu" style="display:none">
     ${user.role==='customer'?`<a onclick="nav('account',{sub:'orders'})">Tài khoản của tôi</a>`:''}
     ${user.role==='employee'?`<a onclick="nav('admin-dash')">Trang quản trị</a>`:''}
     <a onclick="logout()">Đăng xuất</a>
   </div>`;
 }
 return `<header class="top">
  <div class="logo" onclick="nav('home')"><span class="plane">✈</span><div>TravelGo<span>Khám phá thế giới cùng bạn</span></div></div>
  <nav class="cust-nav">${links.map(l=>`<a class="${l[0]===active?'active':''}" onclick="nav('${l[0]}')">${l[1]}</a>`).join('')}</nav>
  <div class="actions">${authArea}</div>
  <div class="dropdown" id="searchBox" style="display:none;top:54px;right:70px;width:260px;padding:10px">
   <input id="headerSearch" placeholder="Tìm tour..." style="width:100%;padding:9px 10px;border:1px solid var(--border);border-radius:8px" onkeydown="if(event.key==='Enter')headerDoSearch()">
  </div>
 </header>`;
}
function toggleNotif(){const m=document.getElementById('notifBox');if(m)m.style.display=m.style.display==='none'?'block':'none';}
function toggleSearchBox(){const m=document.getElementById('searchBox');if(m){m.style.display=m.style.display==='none'?'block':'none'; if(m.style.display==='block') document.getElementById('headerSearch').focus();}}
function headerDoSearch(){const kw=document.getElementById('headerSearch').value;nav('search',{kw});}
function siteFooter(){return `<footer class="site">© 2026 TravelGo — Công ty Du lịch TravelGo · Hotline hỗ trợ: 1900 1900</footer>`;}
function starsHtml(rating){
 const full=Math.round(rating||0);
 return `<span class="stars">${'★'.repeat(full)}${'☆'.repeat(5-full)}</span>`;
}
function tourCard(t,i){
 return `<div class="tour-card" onclick="nav('detail',{id:'${t.id}'})">
  <div class="tour-thumb" style="background:${grad(i)}"><span class="pill">${t.region==='trongnuoc'?'Tour trong nước':'Tour nước ngoài'}</span>
   ${t.discountPercent?`<span class="pill" style="left:auto;right:8px;background:var(--danger);color:#fff">-${t.discountPercent}%</span>`:''}</div>
  <div class="body"><h4>${t.name}</h4><div class="meta">🗓 ${t.duration} · Còn ${t.seats} chỗ</div>
  ${t.reviewCount?`<div class="meta">${starsHtml(t.rating)} ${t.rating}/5 (${t.reviewCount}) · ${t.bookedCount} khách đã đặt</div>`:`<div class="meta">${t.bookedCount||0} khách đã đặt</div>`}
  <div class="price">${fmt(t.cost)}${t.old_cost?`<span class="old">${fmt(t.old_cost)}</span>`:''}</div></div></div>`;
}

/* ================= SITE VIEWS ================= */
async function Home(){
 const tours=await api('/tours');
 return `${siteHeader('home')}
 <section class="hero"><div class="wrap" style="padding:0">
  <h1>Khám phá thế giới<br>cùng TravelGo</h1>
  <p>Những hành trình tuyệt vời đang chờ bạn — đặt tour và thanh toán trực tuyến chỉ trong vài phút.</p>
  <div class="search-bar" style="max-width:820px">
    <div class="seg"><small>Điểm đến</small><input id="qKeyword" placeholder="Nhập điểm đến..."></div>
    <div class="seg"><small>Khoảng giá</small><select id="qPrice"><option value="">Tất cả mức giá</option><option value="0-5000000">Dưới 5 triệu</option><option value="5000000-10000000">5 - 10 triệu</option><option value="10000000-999000000">Trên 10 triệu</option></select></div>
    <button onclick="doSearch()">Tìm kiếm</button>
  </div></div></section>
 <div class="wrap" style="padding:20px 24px 0">
  <div class="grid g4">
   <div class="usp">🌏<div><b>Đa dạng điểm đến</b><span>Trong nước & quốc tế</span></div></div>
   <div class="usp">🏷️<div><b>Giá tốt nhất</b><span>Nhiều ưu đãi hấp dẫn</span></div></div>
   <div class="usp">🛡️<div><b>Đặt tour dễ dàng</b><span>Thanh toán an toàn</span></div></div>
   <div class="usp">🎧<div><b>Hỗ trợ 24/7</b><span>Luôn đồng hành cùng bạn</span></div></div>
  </div>
 </div>
 <div class="wrap" style="padding:28px 24px 32px">
  <h2 style="font-size:20px">Tour nổi bật</h2>
  <div class="grid g4">${tours.slice(0,4).map(tourCard).join('')}</div>
  <h2 style="font-size:20px;margin-top:32px">Tour trong nước / nước ngoài</h2>
  <div class="grid g4">${tours.map(tourCard).join('')}</div>
  <div class="card" style="margin-top:32px;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(120deg,#123B7A,#2F6FD6);color:#fff;flex-wrap:wrap;gap:14px">
    <div><h2 style="margin:0 0 6px;color:#fff">Sẵn sàng cho chuyến đi tiếp theo?</h2><p style="margin:0;opacity:.85">Đăng ký ngay để nhận ưu đãi cho lần đặt tour đầu tiên.</p></div>
    <button class="btn" style="background:#fff;color:var(--blue)" onclick="nav('register')">Đặt tour ngay</button>
  </div>
 </div>${siteFooter()}`;
}
function doSearch(){
 const kw=document.getElementById('qKeyword').value||'';
 const priceRange=document.getElementById('qPrice').value||'';
 nav('search',{kw,priceRange});
}
async function SearchResult(p){
 let q=`?keyword=${encodeURIComponent(p.kw||'')}`;
 if(p.priceRange){const [min,max]=p.priceRange.split('-');q+=`&minPrice=${min}&maxPrice=${max}`;}
 const tours=await api('/tours'+q);
 return `${siteHeader('')}<div class="wrap" style="padding:28px 24px">
  <h2>Kết quả tìm kiếm ${p.kw?`cho "${p.kw}"`:''}</h2>
  <div class="grid g4">${tours.length?tours.map(tourCard).join(''):'<p style="color:var(--muted)">Không tìm thấy tour phù hợp.</p>'}</div>
 </div>${siteFooter()}`;
}
async function TourListView(region){
 const tours=await api('/tours?region='+region);
 return `${siteHeader('list-'+region)}<div class="wrap" style="padding:28px 24px">
  <h2>${region==='trongnuoc'?'Tour trong nước':'Tour nước ngoài'}</h2>
  <p style="color:var(--muted);margin-top:-6px">Tìm thấy ${tours.length} tour</p>
  <div class="grid g4">${tours.map(tourCard).join('')}</div>
 </div>${siteFooter()}`;
}
async function TourDetail(p){
 const t=await api('/tours/'+p.id);
 return `${siteHeader('')}<div class="wrap" style="padding:28px 24px">
  <a onclick="nav('home')" style="color:var(--blue);font-size:13px;font-weight:600">← Quay lại</a>
  <div class="grid g2" style="grid-template-columns:2fr 1fr;margin-top:14px;align-items:start">
   <div>
    <div class="tour-thumb" style="background:${grad(0)};height:260px;border-radius:12px"></div>
    <h1 style="margin:18px 0 6px">${t.name}</h1>
    <p style="color:var(--muted);margin:0 0 4px">${starsHtml(t.rating)} ${t.rating||0}/5 (${t.reviewCount} đánh giá) · Đã đặt ${t.bookedCount}+ lượt</p>

    <div id="tdPane-reviews" style="display:none"></div>

    <div style="font-weight:700;font-size:18px;color:var(--blue);margin-bottom:10px">${fmt(t.cost)} / khách</div>

function tdSwitch(name,btn){
 document.querySelectorAll('#tdTabs button').forEach(b=>b.classList.remove('active')); btn.classList.add('active');
 ['schedule','price','terms','reviews'].forEach(k=>{const el=document.getElementById('tdPane-'+k); if(el) el.style.display = k===name?'block':'none';});
 if(name==='reviews') loadReviews();
}
async function loadReviews(){
 const tourId=route.params.id;
 const pane=document.getElementById('tdPane-reviews');
 pane.innerHTML='<div class="loading">Đang tải đánh giá...</div>';
 const data=await api('/tours/'+tourId+'/reviews');
 const user=getUser();
 pane.innerHTML=`<div class="card">
  <p style="font-weight:700;font-size:16px">${starsHtml(data.average)} ${data.average}/5 · ${data.count} đánh giá</p>
  ${data.reviews.map(r=>`<div class="review-item"><b>${r.reviewer_name}</b> ${starsHtml(r.rating)}<p style="font-size:13.5px;color:#3a4152;margin:4px 0 0">${r.comment||''}</p></div>`).join('')||'<p style="color:var(--muted)">Chưa có đánh giá nào cho tour này.</p>'}
  <div id="writeReviewBox" style="margin-top:14px"></div>
 </div>`;
 if(user&&user.role==='customer'){
  document.getElementById('writeReviewBox').innerHTML=`<button class="btn outline sm" onclick="showReviewForm('${tourId}')">Viết đánh giá</button><div id="reviewFormBox"></div>`;
 }
}
function showReviewForm(tourId){
 document.getElementById('reviewFormBox').innerHTML=`<div style="margin-top:10px">
  <div id="revMsg"></div>
  <div class="star-input" id="starInput">${[1,2,3,4,5].map(n=>`<span data-v="${n}" onclick="setStar(${n})">★</span>`).join('')}</div>
  <textarea id="revComment" rows="2" placeholder="Cảm nhận của bạn về tour..." style="width:100%;margin:8px 0;padding:8px;border:1px solid var(--border);border-radius:8px"></textarea>
  <button class="btn primary sm" onclick="submitReview('${tourId}')">Gửi đánh giá</button>
 </div>`;
}
let selectedStar=5;
function setStar(n){ selectedStar=n; document.querySelectorAll('#starInput span').forEach(s=>s.classList.toggle('sel', +s.dataset.v<=n)); }
async function submitReview(tourId){
 try{
  await api('/tours/'+tourId+'/reviews',{method:'POST',body:JSON.stringify({rating:selectedStar,comment:document.getElementById('revComment').value})});
  loadReviews();
 }catch(e){ document.getElementById('revMsg').innerHTML=`<div class="msg err">${e.message}</div>`; }
}
async function submitBooking(tourId){
 const msg=document.getElementById('bookMsg');
 const user=getUser();
 if(!user||user.role!=='customer'){ msg.innerHTML=`<div class="msg err">Vui lòng đăng nhập bằng tài khoản khách hàng để đặt tour.</div>`; return; }
 const body={tourId,adults:parseInt(document.getElementById('bAdult').value||'0'),children:parseInt(document.getElementById('bChild').value||'0'),
  vehicle:document.getElementById('bVehicle').value,hotel:document.getElementById('bHotel').value,departDate:document.getElementById('bDate').value};
 try{
  const b=await api('/bookings',{method:'POST',body:JSON.stringify(body)});
  nav('account',{sub:'orderDetail',bookingId:b.id});
 }catch(e){ msg.innerHTML=`<div class="msg err">${e.message}</div>`; }
}

/* ---------- Account ---------- */
async function Account(p){
 const sub=p.sub||'orders';
 const sideItems=[['orders','🧾 Đơn đặt tour'],['profile','👤 Trang cá nhân'],['support','💬 Yêu cầu hỗ trợ'],['password','🔑 Đổi mật khẩu']];
 let content='';
 if(sub==='orderDetail') content=await OrderDetail(p.bookingId);
 else if(sub==='orders') content=await OrdersList();
 else if(sub==='profile') content=await Profile();
 else if(sub==='password') content=`<h2 style="margin-top:0">Đổi mật khẩu</h2><p style="color:var(--muted);font-size:13px">Tính năng đổi mật khẩu sẽ được bật khi kết nối SMTP xác thực email thật.</p>`;
 else if(sub==='support') content=`<h2 style="margin-top:0">Yêu cầu hỗ trợ</h2><p style="color:var(--muted)">Gọi hotline <b>1900 1900</b> để được hỗ trợ trực tiếp.</p>`;
 return `${siteHeader('')}<div class="wrap" style="padding:26px 24px"><div class="side-shell">
  <aside class="side">${sideItems.map(x=>`<a class="${x[0]===sub?'active':''}" onclick="nav('account',{sub:'${x[0]}'})">${x[1]}</a>`).join('')}<a onclick="logout()">🚪 Đăng xuất</a></aside>
  <div class="side-content">${content}</div>
 </div></div>${siteFooter()}`;
}

let ordersFilter='all';
async function OrdersList(){
 const mine=await api('/bookings/mine');
 const tabs=[['all','Tất cả'],['wait','Chờ xác nhận'],['confirmed','Đã xác nhận'],['paid','Đã thanh toán'],['cancelled','Đã hủy']];
 const filtered= ordersFilter==='all' ? mine : mine.filter(b=>b.status===ordersFilter);
 return `<h2 style="margin-top:0">Đơn đặt tour</h2>
 <div class="status-tabs" id="orderTabs">${tabs.map(t=>`<button class="${t[0]===ordersFilter?'active':''}" onclick="filterOrders('${t[0]}',this)">${t[1]}</button>`).join('')}</div>
 <div id="ordersListBox">${renderOrdersRows(filtered)}</div>`;
}
function renderOrdersRows(rows){
 if(!rows.length) return '<p style="color:var(--muted)">Không có đơn nào ở trạng thái này.</p>';
 return rows.map((b,i)=>`<div class="order-row"><div class="order-thumb" style="background:${grad(i)}"></div>
 <div class="info"><h4>${b.tour.name}</h4><div class="meta">Ngày đi: ${b.depart_date} · ${b.adults} người lớn${b.children?`, ${b.children} trẻ em`:''} · ${fmt(b.total)}</div></div>
 <span class="badge ${b.status}">${statusLabel[b.status]}</span>
 <button class="btn outline sm" onclick="nav('account',{sub:'orderDetail',bookingId:'${b.id}'})">Xem chi tiết</button></div>`).join('');
}
async function filterOrders(status,btn){
 ordersFilter=status;
 document.querySelectorAll('#orderTabs button').forEach(b=>b.classList.remove('active')); btn.classList.add('active');
 const mine=await api('/bookings/mine');
 const filtered= status==='all' ? mine : mine.filter(b=>b.status===status);
 document.getElementById('ordersListBox').innerHTML=renderOrdersRows(filtered);
}
async function OrderDetail(bookingId){
 const b=await api('/bookings/'+bookingId);
 const canPay = b.status==='wait'||b.status==='confirmed';
 return `<a onclick="nav('account',{sub:'orders'})" style="color:var(--blue);font-size:13px;font-weight:600">← Quay lại đơn đặt tour</a>
 <div style="display:flex;justify-content:space-between;align-items:center;margin:12px 0"><h2 style="margin:0">Chi tiết đơn — ${b.id}</h2><span class="badge ${b.status}">${statusLabel[b.status]}</span></div>
 <div id="odMsg"></div>
 <div class="rule-note">Tour đã thanh toán sẽ <b>không thể hủy</b>. Cần thay đổi? Dùng "Yêu cầu đổi tour" (trong 5 ngày sau khi đặt và trước 7 ngày so với ngày khởi hành tour mới, chỉ 1 lần).</div>
 <p style="font-size:13.5px"><b>Tour:</b> ${b.tour.name}<br><b>Ngày khởi hành:</b> ${b.depart_date} · <b>Số lượng:</b> ${b.adults} người lớn${b.children?`, ${b.children} trẻ em`:''}<br><b>Tổng tiền:</b> ${fmt(b.total)}</p>
 ${canPay?`
  <div class="field" style="max-width:260px"><label>Phương thức thanh toán</label>
   <select id="payMethod"><option>Ví điện tử</option><option>Thẻ ATM</option><option>Chuyển khoản</option><option>Tiền mặt</option></select></div>
  <div class="qr"></div>
  <button class="btn primary sm" onclick="payBooking('${b.id}')">Xác nhận đã quét & thanh toán</button>
  <button class="btn outline sm" onclick="cancelBooking('${b.id}')">Hủy đơn</button>`:''}
 ${b.status==='paid'&&!b.changed?`<button class="btn outline sm" onclick="showChangeForm('${b.id}','${b.tour_id}')">Yêu cầu đổi tour</button>`:''}
 ${b.status==='paid'&&b.changed?`<p style="font-size:12.5px;color:var(--muted)">Đơn này đã sử dụng quyền đổi tour.</p>`:''}
 ${b.status==='cancelled'?`<p style="font-size:12.5px;color:var(--muted)">Đơn này đã bị hủy.</p>`:''}
 <div id="changeFormBox"></div>`;
}
async function payBooking(bookingId){

  const method=document.getElementById('payMethod').value;

  setTimeout(()=>nav('account',{sub:'orderDetail',bookingId}),700);
 }catch(e){ document.getElementById('odMsg').innerHTML=`<div class="msg err">${e.message}</div>`; }

async function cancelBooking(bookingId){
 try{
  await api('/bookings/'+bookingId+'/cancel',{method:'POST'});
  nav('account',{sub:'orderDetail',bookingId});
 }catch(e){ document.getElementById('odMsg').innerHTML=`<div class="msg err">${e.message}</div>`; }
}
async function showChangeForm(bookingId,curTourId){

}

 <td><span class="icon-btn edit" onclick="editTour('${t.id}')">✎</span><span class="icon-btn del" onclick="deleteTour('${t.id}')">🗑</span></td></tr>`).join('')||'<tr><td colspan="8">Không có tour phù hợp</td></tr>';

function applyTourFilter(){
 const kw=val('fKeyword').toLowerCase(), dest=document.getElementById('fDest').value, region=document.getElementById('fRegion').value, seat=document.getElementById('fSeat').value;
 const filtered=toursCache.filter(t=> (!kw||t.name.toLowerCase().includes(kw)) && (!dest||t.to_place===dest) && (!region||t.region===region) && (!seat||t.seatStatus===seat));
 document.getElementById('toursTbody').innerHTML=renderTourRows(filtered);
}
function editTour(id){
 const t=toursCache.find(x=>x.id===id); if(!t) return;
 document.getElementById('tourFormTitle').textContent='Sửa tour — '+t.name;
 document.getElementById('tEditId').value=t.id;
 document.getElementById('tName').value=t.name;
 document.getElementById('tRegion').value=t.region;
 document.getElementById('tFrom').value=t.from_place;
 document.getElementById('tTo').value=t.to_place;
 document.getElementById('tCost').value=t.cost;
 document.getElementById('tOldCost').value=t.old_cost||'';
 document.getElementById('tDur').value=t.duration;
 document.getElementById('tDepart').value=t.depart_date;
 document.getElementById('tSeats').value=t.seats;
 document.getElementById('tSchedule').value=(t.schedule||[]).join('\n');
 document.getElementById('tCancelEditBtn').style.display='inline-block';
 document.getElementById('tourFormTitle').scrollIntoView({behavior:'smooth'});
}
async function saveTour(){
 const msg=document.getElementById('tourMsg');
 const editId=val('tEditId');
 const body={
  name:val('tName'),region:document.getElementById('tRegion').value,from_place:val('tFrom'),to_place:val('tTo'),
  cost:parseInt(val('tCost')||'0'),old_cost:parseInt(val('tOldCost')||'0'),duration:val('tDur'),depart_date:val('tDepart'),seats:parseInt(val('tSeats')||'0'),
  schedule:(val('tSchedule')||'').split('\n').filter(Boolean)
 };
 try{
  if(editId){ await api('/tours/'+editId,{method:'PUT',body:JSON.stringify(body)}); }
  else{ await api('/tours',{method:'POST',body:JSON.stringify(body)}); }
  nav('admin-tours');
 }catch(e){ msg.innerHTML=`<div class="msg err">${e.message}</div>`; }
}
async function deleteTour(id){ if(!confirm('Xóa tour này?')) return; await api('/tours/'+id,{method:'DELETE'}); nav('admin-tours'); }

 document.getElementById('bookingsTbody').innerHTML=renderBookingRows(bookings);
}

let financePage=1;
function mountFinanceCharts(invoices,revByMonth,methods){
 new Chart(document.getElementById('financeLineChart'),{type:'line',data:{labels:revByMonth.map(r=>r.label),datasets:[{data:revByMonth.map(r=>r.total),borderColor:'#2F5CE0',backgroundColor:'rgba(47,92,224,.12)',fill:true,tension:.3}]},options:{plugins:{legend:{display:false}},scales:{y:{ticks:{callback:v=>(v/1000000)+'tr'}}}}});
 new Chart(document.getElementById('financeDonutChart'),{type:'doughnut',data:{labels:methods.map(m=>m.method),datasets:[{data:methods.map(m=>m.share),backgroundColor:['#2F5CE0','#1FAE6B','#F5A623','#9AA2B1']}]},options:{plugins:{legend:{display:false}}}});
 renderFinancePage(invoices);
}
function renderFinancePage(invoices){
 const perPage=5, pages=Math.max(1,Math.ceil(invoices.length/perPage));
 const slice=invoices.slice((financePage-1)*perPage, financePage*perPage);
 document.getElementById('financeTbody').innerHTML=slice.map(i=>`<tr><td>${i.id}</td><td>${i.customer_name||'—'}</td><td>${fmt(i.amount)}</td><td>${i.payment_method}</td><td><span class="badge paid">Thành công</span></td><td>${i.invoice_date}</td></tr>`).join('')||'<tr><td colspan="6">Chưa có giao dịch</td></tr>';
 document.getElementById('financePager').innerHTML=Array.from({length:pages},(_,i)=>i+1).map(p=>`<button class="${p===financePage?'active':''}" onclick="financeGoto(${p})">${p}</button>`).join('');
 window.__financeInvoices=invoices;
}

async function render(){
 const app=document.getElementById('app');
 app.innerHTML='<div class="loading">Đang tải...</div>';
 const user=getUser();
 if(route.view.startsWith('admin') && (!user || user.role!=='employee')){ route={view:'login',params:{}}; }
 try{
  let html;
  switch(route.view){
   case 'home': html=await Home(); break;
   case 'list-trongnuoc': html=await TourListView('trongnuoc'); break;
   case 'list-nuocngoai': html=await TourListView('nuocngoai'); break;
   case 'detail': html=await TourDetail(route.params); break;
   case 'search': html=await SearchResult(route.params); break;
   case 'login': html=Login(); break;
   case 'register': html=Register(); break;
   case 'account': html=await Account(route.params); break;
   case 'blog': html=`${siteHeader('blog')}<div class="wrap" style="padding:28px 24px"><h2>Blog du lịch</h2><p style="color:var(--muted)">Cẩm nang & kinh nghiệm du lịch sẽ sớm được cập nhật.</p></div>${siteFooter()}`; break;
   case 'contact': html=`${siteHeader('contact')}<div class="wrap" style="padding:28px 24px"><h2>Liên hệ</h2><p>Hotline: <b>1900 1900</b> · Email: support@travelgo.vn</p></div>${siteFooter()}`; break;
   case 'admin-dash': html=await AdminDash(); break;
   case 'admin-tours': html=await AdminTours(); break;
   case 'admin-bookings': html=await AdminBookings(); break;
   case 'admin-crm': html=await AdminCRM(); break;
   case 'admin-staff': html=await AdminStaff(); break;
   case 'admin-finance': html=await AdminFinance(); break;
   case 'admin-suppliers': html=await AdminSuppliers(); break;
   case 'admin-reports': html=await AdminReports(); break;
   default: html=await Home();
  }
  app.innerHTML=html;
  if(route.view==='admin-finance'){
   const [invoices,revByMonth,methods]=await Promise.all([api('/stats/invoices'),api('/stats/revenue-by-month'),api('/stats/payment-methods')]);
   financePage=1; mountFinanceCharts(invoices,revByMonth,methods);
  }
  if(route.view==='admin-reports'){ await loadReportBody(); }
 }catch(e){
  app.innerHTML=`${siteHeader('')}<div class="wrap" style="padding:40px 24px"><div class="msg err">${e.message||'Không thể tải dữ liệu từ máy chủ.'}</div></div>`;
 }
}
render();
</script>
</body>
</html>
